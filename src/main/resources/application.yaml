spring:
  application:
    name: flightservice

  datasource:
    url: jdbc:postgresql://localhost:5432/airline_flight_db
    username: airline_user
    password: ${DB_PASSWORD:airline_dev_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    create-schemas: true


server:
    port: 8080

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG